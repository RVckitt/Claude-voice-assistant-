[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vox-assistant"
version = "0.1.0"
description = "Hands-free 'hey claude' voice assistant for Linux: local wake word, speech-to-text and voice, answers from Claude."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.14",
    "numpy>=1.24",
    "PySide6>=6.6",
]

[project.optional-dependencies]
openwakeword = ["openwakeword>=0.6"]
dev = ["pytest"]

[project.scripts]
vox = "vox.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["vox"]
